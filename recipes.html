<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section>
            <span class="title">About</span>
            <p style="font-size: 0.7em;">These are recipes that I have validated in my own kitchen. Vegetarian.</p>
            <a href="mexican-dinner\mexican.html" target="_top"><img src="mexican-dinner\chilli.gif"> Mexican Dinner Party</a><br><br>
            <span class="title" id="nav-recipe-title">Navigation</span>
            <div class="recipe_links">
                <ul>
                    <li><a href="#buffdip">Buffalo Dip</a></li>
                    <li><a href="#chili">Chili</a></li>
                </ul>
            </div>
        </section>
        <div class="recipes" id="recipe-container"></div>
    </div>
    <script>
        function parseRecipes(recipes) {
            const box = document.getElementById("recipe-container");

            for (let r of recipes) {
                box.innerHTML += "<h1 id=" + r.id+">"+r.title+"</h1>";
                
                box.innerHTML += "<h2>Ingredients</h2>";
                let listElement = document.createElement('ul');
                let listItem = document.createElement('li');
                box.appendChild(listElement);
                for (let i of r.ingredients) {
                    listItem.textContent = i;
                    listElement.appendChild(listItem);
                    listItem = document.createElement('li');
                };

                box.innerHTML += "<h2>Method</h2>";
                listElement = document.createElement('ol');
                listItem = document.createElement('li');
                box.appendChild(listElement);
                for (let i of r.methods) {
                    listItem.textContent = i;
                    listElement.appendChild(listItem);
                    listItem = document.createElement('li');
                };
                box.innerHTML += "<img src=\"img/decor/emojis/carrot.gif\">";
            }
        };
        async function loadJSON() {
            const response = await fetch("recipes.json");
            const recipes = await response.json();
            parseRecipes(recipes);
        };
        loadJSON();
    </script>
</body>
</html>
